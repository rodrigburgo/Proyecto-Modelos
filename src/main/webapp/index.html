<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventosMaster - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-bg">
        <div class="login-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <div class="login-container">
            <div class="login-brand">
                <div class="brand-icon"><i class="fas fa-ticket-alt"></i></div>
                <h1>EventosMaster</h1>
                <p>Tu plataforma de eventos en Colombia</p>
            </div>

            <div class="login-card">
                <h2>Iniciar Sesión</h2>

                <div id="error-msg" class="alert alert-error" style="display:none">
                    <i class="fas fa-exclamation-circle"></i> Email o contraseña incorrectos.
                </div>

                <form action="login" method="post" class="login-form">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Correo electrónico</label>
                        <input type="email" name="email" placeholder="tu@email.com"
                               class="form-input" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Contraseña</label>
                        <div class="input-pass-wrap">
                            <input type="password" name="password" placeholder="••••••"
                                   class="form-input" required id="passInput">
                            <button type="button" class="toggle-pass" onclick="togglePass()">
                                <i class="fas fa-eye" id="passIcon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>

                <div class="demo-users">
                    <p class="demo-title"><i class="fas fa-users"></i> Usuarios de prueba</p>
                    <div class="demo-grid">
                        <button class="demo-btn" onclick="fillLogin('ana@email.com','123456')">
                            <i class="fas fa-user"></i> Ana García
                        </button>
                        <button class="demo-btn" onclick="fillLogin('carlos@email.com','123456')">
                            <i class="fas fa-user"></i> Carlos López
                        </button>
                        <button class="demo-btn" onclick="fillLogin('maria@email.com','123456')">
                            <i class="fas fa-user"></i> María Torres
                        </button>
                    </div>
                </div>
            </div>

            <div class="login-footer">
                <span>🎵 Conciertos</span>
                <span>⚽ Deportes</span>
                <span>🎭 Teatro</span>
            </div>
        </div>
    </div>

    <script>
        // Mostrar error si viene de login fallido
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
            document.getElementById('error-msg').style.display = 'flex';
        }

        function fillLogin(email, pass) {
            document.querySelector('[name=email]').value = email;
            document.querySelector('[name=password]').value = pass;
        }

        function togglePass() {
            const inp = document.getElementById('passInput');
            const ico = document.getElementById('passIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                ico.className = 'fas fa-eye-slash';
            } else {
                inp.type = 'password';
                ico.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
